<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>{{TITLE_KO}} — POSTER ARCHIVE</title>
<meta name="description" content="{{TITLE_KO}}{{TITLE_EN_META}} / {{ARTIST}}">
<meta property="og:type" content="website">
<meta property="og:title" content="{{TITLE_KO}} — POSTER ARCHIVE">
<meta property="og:description" content="{{TITLE_KO}}{{TITLE_EN_META}} / {{ARTIST}}">
<meta property="og:url" content="https://local-jinny.github.io/NextStop/poster/{{ID}}.html">
<meta property="og:image" content="https://local-jinny.github.io/NextStop/assets/images/og-image.jpg">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:title" content="{{TITLE_KO}} — POSTER ARCHIVE">
<meta name="twitter:description" content="{{TITLE_KO}}{{TITLE_EN_META}} / {{ARTIST}}">
<meta name="twitter:image" content="https://local-jinny.github.io/NextStop/assets/images/og-image.jpg">
<link rel="stylesheet" href="../assets/css/style.css">
</head>
<body>

<header class="site-header">
  <div class="wrap">
    <a class="site-logo" href="../index.html"><span class="pin">✦</span> 환승역: NEXT STOP</a>
    <div class="header-actions">
      <button class="signboard" id="random-poster-btn" type="button" data-total="{{COUNT}}">RANDOMIZED</button>
      <a class="signboard" href="../gallery.html">← 아카이브로</a>
    </div>
  </div>
</header>

<main class="poster-detail">
  <div class="wrap">
    <div class="detail-grid">

      <div class="detail-image">
{{DETAIL_IMAGE_BLOCK}}
      </div>

      <div class="detail-info">
        <div class="tag-row">
          <span class="tag">
            <span class="tag-label">Platform</span>
            <span class="flap" data-target="{{ID}}"><span class="flap-digit">0</span><span class="flap-digit">0</span></span>
          </span>
        </div>
        <h1 class="title-ko">{{TITLE_KO}}</h1>
        <p class="title-en">{{TITLE_EN}}</p>

        <p class="artist">{{ARTIST}}</p>
        {{SNS_BLOCK}}

        <p class="detail-desc">{{DESC}}</p>

        <div class="transfer-nav">
          <a href="{{PREV_HREF}}"><small>◀ PREV</small><span class="transfer-nav-title">{{PREV_TITLE}}</span></a>
          <a href="{{NEXT_HREF}}"><small>NEXT ▶</small><span class="transfer-nav-title">{{NEXT_TITLE}}</span></a>
        </div>
      </div>

    </div>
  </div>
</main>

<footer class="site-footer">
  <div class="wrap">yawayats 70th EXHIBITION · 2026</div>
</footer>

<script src="../assets/js/flap.js"></script>
<script src="../assets/js/poster-slider.js"></script>
<script src="../assets/js/random-poster.js"></script>

</body>
</html>
