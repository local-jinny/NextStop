<body>

<header class="site-header">

  </div>

  <div class="wrap">
    <div class="gallery-grid">
{{CARDS}}
    </div>
  </div>

<footer class="site-footer">
  <div class="wrap">yawayats 70th EXHIBITION · 2026</div>
</footer>

<script>
  var cards = document.querySelectorAll('.poster-reveal');
  if (!('IntersectionObserver' in window)) {
    cards.forEach(function (card) { card.classList.add('is-visible'); });
  } else {
    var lastScrollY = window.scrollY;
    var STAGGER = 0.14; // 카드 하나당 순차 지연(초) — 클수록 한 줄이 천천히 훑듯 나타남

    var observer = new IntersectionObserver(function (entries) {
      var scrollingUp = window.scrollY < lastScrollY;
      lastScrollY = window.scrollY;

      entries.forEach(function (entry, i) {
        var card = entry.target;
        card.style.transitionDelay = (i * STAGGER) + 's';
        if (entry.isIntersecting) {
          // 아래에서 올라오며 나타날지, 위에서 내려오며(역방향) 나타날지 스크롤 방향에 따라 결정
          card.classList.toggle('reveal-from-above', scrollingUp);
          card.classList.add('is-visible');
        } else {
          // 뷰포트를 벗어나면 다시 숨겨서, 재진입(백스크롤 포함) 시 애니메이션이 다시 재생되게 함
          card.classList.remove('is-visible');
        }
      });
    }, { threshold: 0.05 });
    cards.forEach(function (card) { observer.observe(card); });
  }
</script>
<script src="assets/js/random-poster.js"></script>

</body>
</html>
