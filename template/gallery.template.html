<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>POSTER ARCHIVE — 그래픽 포스터 온라인 전시</title>
<meta name="description" content="12장의 그래픽 포스터를 소개하는 온라인 아카이브 전시">
<link rel="stylesheet" href="assets/css/style.css">
</head>
<body>

<header class="site-header">
  <div class="wrap">
    <a class="site-logo" href="index.html"><span class="pin">✦</span> 환승역: NEXT STOP</a>
    <a class="signboard" href="info.html">Info</a>
  </div>
</header>

<section class="gallery-intro">
  <div class="wrap">
    <div class="gallery-logo">
      <img src="assets/images/Title.svg" alt="환승역: NEXT STOP">
    </div>
    <p>12개의 정거장, 12장의 포스터. 한 장씩 클릭하며 각자의 이야기를 만나보세요.</p>
  </div>
</section>

<section class="gallery" id="gallery">
  <div class="wrap">
    <div class="gallery-grid">
{{CARDS}}
    </div>
  </div>
</section>

<footer class="site-footer">
  <div class="wrap">yawayats 70th EXHIBITION · 2026</div>
</footer>

<script>
  var cards = document.querySelectorAll('.poster-card');
  if (!('IntersectionObserver' in window)) {
    cards.forEach(function (card) { card.classList.add('is-visible'); });
  } else {
    var observer = new IntersectionObserver(function (entries) {
      entries.forEach(function (entry, i) {
        if (!entry.isIntersecting) return;
        entry.target.style.transitionDelay = (i * 0.08) + 's';
        entry.target.classList.add('is-visible');
        observer.unobserve(entry.target);
      });
    }, { threshold: 0.05 });
    cards.forEach(function (card) { observer.observe(card); });
  }
</script>

</body>
</html>
